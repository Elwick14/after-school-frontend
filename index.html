<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>After School Classes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="app" class="container py-4">
    <h1>After School Classes</h1>
    <p><i class="fa-solid fa-cart-shopping"></i> Cart: {{ cartItemCount }}</p>

    <div class="row">
      <div class="col-md-4 mb-3" v-for="lesson in lessons" :key="lesson._id">
        <div class="card p-3">
          <h5><i class="fa-solid fa-book"></i> {{ lesson.topic }}</h5>
          <p class="mb-1">Location: {{ lesson.location }}</p>
          <p class="mb-1">Price: £{{ lesson.price }}</p>
          <p class="mb-1">Spaces: {{ lesson.space }}</p>
          <button class="btn btn-primary" @click="addToCart(lesson)" :disabled="lesson.space === 0">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return { lessons: [], cart: [] };
      },
      computed: {
        cartItemCount() {
          return this.cart.length;
        }
      },
      methods: {
        addToCart(lesson) {
          if (lesson.space > 0) {
            lesson.space--;
            this.cart.push(lesson);
          }
        }
      },
      created() {
        fetch("https://m01147721-after-school-backend.onrender.com/lessons")
          .then(response => response.json())
          .then(data => { this.lessons = data; });
      }
    }).mount("#app");
  </script>
</body>
</html>
