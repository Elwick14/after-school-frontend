<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>After School Classes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="app" class="container py-4">
    <h1>After School Classes</h1>
    <button class="btn btn-success mb-3" @click="toggleCart" :disabled="cart.length === 0">
      <i class="fa-solid fa-cart-shopping"></i> Cart ({{ cartItemCount }})
    </button>

    <!-- Lessons page -->
    <div v-if="showLessons">
      <div class="row">
        <div class="col-md-4 mb-3" v-for="lesson in lessons" :key="lesson._id">
          <div class="card p-3">
            <h5><i class="fa-solid fa-book"></i> {{ lesson.topic }}</h5>
            <p class="mb-1">Location: {{ lesson.location }}</p>
            <p class="mb-1">Price: £{{ lesson.price }}</p>
            <p class="mb-1">Spaces: {{ lesson.space }}</p>
            <button class="btn btn-primary" @click="addToCart(lesson)" :disabled="lesson.space === 0">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Cart page -->
    <div v-else>
      <h2>Your Cart</h2>
      <ul class="list-group mb-3">
        <li class="list-group-item d-flex justify-content-between align-items-center" v-for="(item, index) in cart" :key="index">
          <span>{{ item.topic }} - {{ item.location }} (£{{ item.price }})</span>
          <button class="btn btn-danger btn-sm" @click="removeFromCart(index)">Remove</button>
        </li>
      </ul>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return { lessons: [], cart: [], showLessons: true };
      },
      computed: {
        cartItemCount() {
          return this.cart.length;
        }
      },
      methods: {
        addToCart(lesson) {
          if (lesson.space > 0) {
            lesson.space--;
            this.cart.push(lesson);
          }
        },
        removeFromCart(index) {
          const lesson = this.cart[index];
          lesson.space++;
          this.cart.splice(index, 1);
          if (this.cart.length === 0) {
            this.showLessons = true;
          }
        },
        toggleCart() {
          this.showLessons = !this.showLessons;
        }
      },
      created() {
        fetch("https://m01147721-after-school-backend.onrender.com/lessons")
          .then(response => response.json())
          .then(data => { this.lessons = data; });
      }
    }).mount("#app");
  </script>
</body>
</html>
