<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>After School Classes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="app" class="container py-4">
    <h1>After School Classes</h1>
    <button class="btn btn-success mb-3" @click="toggleCart" :disabled="cart.length === 0">
      <i class="fa-solid fa-cart-shopping"></i> Cart ({{ cartItemCount }})
    </button>

    <div class="alert alert-success" v-if="orderMessage">{{ orderMessage }}</div>

    <!-- Lessons page -->
    <div v-if="showLessons">
      <!-- Sort controls -->
      <div class="row mb-3">
        <div class="col-md-3">
          <label class="form-label">Sort by</label>
          <select class="form-select" v-model="sortBy">
            <option value="topic">Subject</option>
            <option value="location">Location</option>
            <option value="price">Price</option>
            <option value="space">Spaces</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Order</label>
          <select class="form-select" v-model="sortOrder">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3" v-for="lesson in sortedLessons" :key="lesson._id">
          <div class="card p-3">
            <h5><i class="fa-solid fa-book"></i> {{ lesson.topic }}</h5>
            <p class="mb-1">Location: {{ lesson.location }}</p>
            <p class="mb-1">Price: £{{ lesson.price }}</p>
            <p class="mb-1">Spaces: {{ lesson.space }}</p>
            <button class="btn btn-primary" @click="addToCart(lesson)" :disabled="lesson.space === 0">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Cart page -->
    <div v-else>
      <h2>Your Cart</h2>
      <ul class="list-group mb-3">
        <li class="list-group-item d-flex justify-content-between align-items-center" v-for="(item, index) in cart" :key="index">
          <span>{{ item.topic }} - {{ item.location }} (£{{ item.price }})</span>
          <button class="btn btn-danger btn-sm" @click="removeFromCart(index)">Remove</button>
        </li>
      </ul>

      <!-- Checkout -->
      <h3>Checkout</h3>
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" v-model="name">
        <small class="text-danger" v-if="name && !isNameValid">Name must contain letters only.</small>
      </div>
      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" class="form-control" v-model="phone">
        <small class="text-danger" v-if="phone && !isPhoneValid">Phone must contain numbers only.</small>
      </div>
      <button class="btn btn-primary" @click="submitOrder" :disabled="!canCheckout">Checkout</button>
    </div>
  </div>

    <script>
    const { createApp } = Vue;

    createApp({
      // data(): the values the page keeps track of
      data() {
        return {
          lessons: [],        // all lessons, loaded from the back-end
          cart: [],           // lessons the user added to the cart
          showLessons: true,  // true = lessons page, false = cart page
          name: "",           // checkout name
          phone: "",          // checkout phone
          orderMessage: "",   // confirmation message after checkout
          sortBy: "topic",    // attribute used for sorting
          sortOrder: "asc"    // "asc" or "desc"
        };
      },
      // computed: values worked out from the data; they update automatically
      computed: {
        cartItemCount() {
          return this.cart.length;
        },
        // name must be letters (and spaces) only
        isNameValid() {
          return /^[A-Za-z ]+$/.test(this.name);
        },
        // phone must be digits only
        isPhoneValid() {
          return /^[0-9]+$/.test(this.phone);
        },
        // the Checkout button is enabled only when both are valid
        canCheckout() {
          return this.isNameValid && this.isPhoneValid;
        },
        // a sorted copy of the lessons, based on the dropdown choices
        sortedLessons() {
          const list = [...this.lessons];
          list.sort((a, b) => {
            let result;
            if (typeof a[this.sortBy] === "string") {
              result = a[this.sortBy].localeCompare(b[this.sortBy]);
            } else {
              result = a[this.sortBy] - b[this.sortBy];
            }
            return this.sortOrder === "asc" ? result : -result;
          });
          return list;
        }
      },
      // methods: functions the page can call (e.g. from buttons)
      methods: {
        // add one space of a lesson to the cart and reduce its spaces by one
        addToCart(lesson) {
          if (lesson.space > 0) {
            lesson.space--;
            this.cart.push(lesson);
            this.orderMessage = "";
          }
        },
        // remove a lesson from the cart and give its space back
        removeFromCart(index) {
          const lesson = this.cart[index];
          lesson.space++;
          this.cart.splice(index, 1);
          if (this.cart.length === 0) {
            this.showLessons = true;
          }
        },
        // switch between the lessons page and the cart page
        toggleCart() {
          this.showLessons = !this.showLessons;
        },
        // checkout: save the order (POST), then update each lesson's spaces (PUT)
        submitOrder() {
          const baseUrl = "https://m01147721-after-school-backend.onrender.com";

          const order = {
            name: this.name,
            phone: this.phone,
            lessonIDs: this.cart.map(item => item._id),
            spaces: this.cart.length
          };

          fetch(baseUrl + "/orders", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(order)
          })
            .then(response => response.json())
            .then(() => {
              // new Set removes duplicates, so each lesson is updated once
              const uniqueLessons = [...new Set(this.cart)];
              return Promise.all(uniqueLessons.map(lesson =>
                fetch(baseUrl + "/lessons/" + lesson._id, {
                  method: "PUT",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ space: lesson.space })
                })
              ));
            })
            .then(() => {
              this.orderMessage = "Thank you " + this.name + ", your order has been submitted!";
              this.cart = [];
              this.name = "";
              this.phone = "";
              this.showLessons = true;
            });
        }
      },
      // created(): runs once when the app starts; loads the lessons (GET)
      created() {
        fetch("https://m01147721-after-school-backend.onrender.com/lessons")
          .then(response => response.json())
          .then(data => { this.lessons = data; });
      }
    }).mount("#app");
  </script>
</body>
</html>
